server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    # location /api/ {
    #     proxy_pass http://host.docker.internal:8081/api/;
    # }
    location /healthz { return 200 'ok'; add_header Content-Type text/plain; }
}
