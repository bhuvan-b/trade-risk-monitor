---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-engine
  namespace: risk
spec:
  replicas: 1   # Single consumer per group for ordering guarantees; scale via partitions
  selector:
    matchLabels:
      app: risk-engine
  template:
    metadata:
      labels:
        app: risk-engine
    spec:
      containers:
        - name: risk-engine
          image: risk/risk-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          env:
            - name: KAFKA_BROKER
              value: kafka.risk.svc.cluster.local:9092
            - name: PGHOST
              value: postgres.risk.svc.cluster.local
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3002
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
# Internal-only service — no Ingress route
apiVersion: v1
kind: Service
metadata:
  name: risk-engine
  namespace: risk
spec:
  selector:
    app: risk-engine
  ports:
    - port: 3002
      targetPort: 3002
