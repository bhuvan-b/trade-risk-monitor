apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: risk-engine
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - risk

  selector:
    matchLabels:
      app: risk-engine

  podMetricsEndpoints:
    - port: metrics
      path: /metrics
