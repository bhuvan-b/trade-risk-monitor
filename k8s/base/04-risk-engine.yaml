apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-engine
  namespace: risk
  labels:
    app: risk-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: risk-engine
  template:
    metadata:
      labels:
        app: risk-engine
      annotations:
        # Prometheus scrape annotations — Phase 8 will pick these up
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: risk-engine
          image: localhost:5000/risk-engine:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9090   # Prometheus metrics
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-0.kafka:9092"
            - name: KAFKA_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_TOPIC
            #   value: "trades"
            - name: KAFKA_GROUP_ID
              value: "risk-engine"
            - name: DEFAULT_EXPOSURE_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: DEFAULT_EXPOSURE_LIMIT
            #   value: "10000000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
          livenessProbe:
            # Risk engine is a long-running consumer; probe via metrics endpoint
            httpGet:
              path: /metrics
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# Expose metrics port for Prometheus scraping (not Ingress-reachable)
apiVersion: v1
kind: Service
metadata:
  name: risk-engine
  namespace: risk
  labels:
    app: risk-engine
spec:
  selector:
    app: risk-engine
  ports:
    - name: metrics
      port: 9090
  type: ClusterIP
