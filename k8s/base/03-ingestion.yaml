apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: risk
  labels:
    app: ingestion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
        - name: ingestion
          image: localhost:5000/ingestion:latest   # local registry; swap for your Docker Hub image
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-0.kafka:9092"
            - name: KAFKA_TOPIC
              value: "trades"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: risk
spec:
  selector:
    app: ingestion
  ports:
    - port: 8080
  # ClusterIP only — NOT reachable from outside the cluster
  type: ClusterIP
