apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: risk-ingress
  namespace: risk
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # - path: /api
          #   pathType: Prefix
          #   backend:
          #     service:
          #       name: alert-api
          #       port:
          #         number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /risk-engine/metrics
            pathType: Prefix
            backend:
              service:
                name: risk-engine
                port:
                  number: 9090
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: monitoring-kube-prometheus-prometheus.monitoring
                port:
                  number: 9090