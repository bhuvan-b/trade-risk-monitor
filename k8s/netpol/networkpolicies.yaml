# ── Default deny all ingress+egress in the risk namespace ───────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: risk
spec:
  podSelector: {}   # matches all pods in namespace
  policyTypes:
    - Ingress
    - Egress
---
# ── Allow DNS egress for all pods (required for service discovery) ────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: risk
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# ── Ingestion: can only reach Kafka ─────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingestion-egress
  namespace: risk
spec:
  podSelector:
    matchLabels:
      app: ingestion
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9092

---
# Ingestion: accept traffic from trade-generator and ingress-nginx only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingestion-ingress
  namespace: risk
spec:
  podSelector:
    matchLabels:
      app: ingestion
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: trade-generator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
---
# ── Risk Engine: can reach Kafka + Postgres only ─────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: risk-engine-egress
  namespace: risk
spec:
  podSelector:
    matchLabels:
      app: risk-engine
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9092
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
---
# Risk Engine: accept Prometheus scrape from monitoring namespace only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: risk-engine-ingress
  namespace: risk
spec:
  podSelector:
    matchLabels:
      app: risk-engine
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
---
# ── Alert API: can reach Postgres only ──────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alert-api-egress
  namespace: risk
spec:
  podSelector:
    matchLabels:
      app: alert-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
---
# Alert API: accept traffic from frontend and ingress-nginx only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alert-api-ingress
  namespace: risk
spec:
  podSelector:
    matchLabels:
      app: alert-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
---
# ── Frontend: can only reach alert-api ──────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress
  namespace: risk
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: alert-api
      ports:
        - port: 8080
---
# Frontend: accept traffic from ingress-nginx only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-ingress
  namespace: risk
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 80
---
# ── Postgres: accept connections from risk-engine and alert-api only ─────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: risk
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: risk-engine
        - podSelector:
            matchLabels:
              app: alert-api
      ports:
        - port: 5432
---
# ── Kafka: accept connections from ingestion and risk-engine only ────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ingress
  namespace: risk
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ingestion
        - podSelector:
            matchLabels:
              app: risk-engine
      ports:
        - port: 9092
---
# ── Trade Generator: can only reach ingestion ────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trade-generator-egress
  namespace: risk
spec:
  podSelector:
    matchLabels:
      app: trade-generator
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: ingestion
      ports:
        - port: 8080
