apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-api
  namespace: risk
  labels:
    app: alert-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alert-api
  template:
    metadata:
      labels:
        app: alert-api
    spec:
      containers:
        - name: alert-api
          image: localhost:5000/alert-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: DEFAULT_EXPOSURE_LIMIT
              value: "10000000"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: alert-api
  namespace: risk
spec:
  selector:
    app: alert-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
